# Environment Settings
# These settings specify the hardware and distributed setup for the model training.
# Adjust `num_gpus` and `dist_config` according to your distributed training environment.
env_setting:
  num_workers: 8  # Number of worker threads for data loading.
  seed: 1234  # Seed for random number generators to ensure reproducibility.
  dist_cfg:
    dist_backend: nccl  # Distributed training backend, 'nccl' for NVIDIA GPUs.
    dist_url: tcp://localhost:19427  # URL for initializing distributed training.
    world_size: 1  # Total number of processes in the distributed training.

data_cfg:
  clean_train_json: data/train_speech.json
  noise_train_json: data/train_noise.json
  rir_train_json: data/train_rir.json
  clean_valid_json: data/val_clean.json
  degraded_valid_json: data/val_degraded.json

# Optional clean-target quality filtering. The simulation code expects these
# scores to be precomputed by external DNSMOS/VQScore tooling.
quality_filter:
  scores: null
  use_dnsmos_filter: false
  dnsmos_threshold: 3.0
  dnsmos_fields: [ovrl, sig, bak, p808]
  vqscore_threshold: null
  whitelist: null
  whitelist_patterns: []
  missing_scores: fail

experiment_cfg:
  exp_path: exp
  experiment_name: train_semambapp
  stdout_interval: 200
  checkpoint_interval: 5000
  summary_interval: 1000
  validation_interval: 5000



degradation_cfg:
  snr: [-10, -5, 0, 5, 10, 15, 20]
  bandwidth_sr: [4000, 6000, 8000, 10000, 12000, 14000]
  bandwidth_type : ["kaiser_best", "kaiser_fast", "scipy", "polyphase"]
  lowpass_type: ["butter", "cheby1", "cheby2", "bessel", "ellip"]
  lowpass_order: [2, 4, 6, 8]
  clipping_min: [0.0, 0.1]
  clipping_max: [0.9, 1.0]
  packet_duration: [10, 20]
  packet_loss_rate: [0.05, 0.25]
  max_continuous_packet_loss: 5
  codec:
    - {format: "mp3", encoder: "None", qscale: 2}
    - {format: "mp3", encoder: "None", qscale: 5}
    - {format: "ogg", encoder: "vorbis", qscale: 2}
    - {format: "ogg", encoder: "vorbis", qscale: 5}
  wind_snr: [-5, 0, 5, 10]
  mic_eq_low_shelf_gain_db: [-6.0, 6.0]
  mic_eq_high_shelf_gain_db: [-8.0, 4.0]
  mic_eq_peak_gain_db: [-6.0, 6.0]
  mic_eq_peak_freq: [500, 1000, 2000, 3500]
  mic_eq_peak_width_oct: [0.5, 1.0, 1.5]
  agc_threshold_db: [-30.0, -12.0]
  agc_ratio: [1.5, 4.0]
  agc_attack_ms: [5.0, 50.0]
  agc_release_ms: [50.0, 300.0]
  agc_makeup_gain_db: [-3.0, 6.0]
  adc_bit_depth: [8, 12, 16]
  adc_lowpass_freq: [3400, 6000, 7600]
  adc_highpass_freq: [20, 80, 120]
  max_degradations: 5
  noise_prob: 1.0
  reverb_prob: 0.7
  mic_eq_prob: 0.6
  agc_prob: 0.3
  adc_prob: 0.2
  bandwidth_prob: 0.7
  clipping_prob: 0.5
  packet_loss_prob: 0.2
  codec_prob: 0.4
  wind_noise_prob: 0.3


# Training Configuration
# This section details parameters that directly influence the training process,
# including batch sizes, learning rates, and optimizer specifics.
training_cfg:
  training_epochs: 100 # Training epoch.
  batch_size: 8  # Training batch size.
  learning_rate: 0.0002  # Initial learning rate.
  adam_b1: 0.8  # Beta1 hyperparameter for the AdamW optimizer.
  adam_b2: 0.99  # Beta2 hyperparameter for the AdamW optimizer.
  lr_decay: 0.99  # Learning rate decay per epoch.
  segment_size: 24000  # Audio segment size used during training, dependent on sampling rate.
  loss:
    adv_g: 1.0
    metric: 0.05
    fm_g: 1.0
    magnitude: 0.9
    phase: 0.3
    complex: 0.1
    time: 0.05
    mel: 0.1
    consistancy: 0.1
  use_PCS400: False  # Use PCS or not

# STFT Configuration
# Configuration for Short-Time Fourier Transform (STFT), crucial for audio processing models.
stft_cfg:
  sampling_rate: 16000  # Audio sampling rate in Hz.
  n_fft: 400  # FFT components for transforming audio signals.
  hop_size: 100  # Samples between successive frames.
  win_size: 400  # Window size used in FFT.

# Model Configuration
# Defines the architecture specifics of the model, including layer configurations and feature compression.
model_cfg:
  hid_feature: 48 

  unet_expansion: 1
  compress_factor: 0.3  # Compression factor applied to extracted features.
  num_tfmamba: 4  # Number of Time-Frequency Mamba (TFMamba) blocks in the model.
  d_state: 16  # Dimensionality of the state vector in Mamba blocks.
  d_conv: 4  # Convolutional layer dimensionality within Mamba blocks.
  expand: 2  # Expansion factor for the layers within the Mamba blocks.
  norm_epsilon: 0.00001  # Numerical stability in normalization layers within the Mamba blocks.
  beta: 2.0  # Hyperparameter for the Learnable Sigmoid function.
  input_channel: 2 # Magnitude and Phase
  output_channel: 1  # Single Channel Speech Enhancement
  dropout: 0.1
